<div class="page-container">
  <h1 class="page-title">פנימיות</h1>

  @if (loading()) {
    <app-loading-skeleton />
  } @else if (error(); as err) {
    <app-error-state [message]="err" (retry)="retry()" />
  } @else if (places().length === 0) {
    <app-empty-state message="אין פנימיות להצגה" />
  } @else {
    <div class="actions mb-1">
      <a mat-stroked-button color="primary" routerLink="/students">כל התלמידים</a>
    </div>

    <app-generic-table [columns]="columns" [data]="places()" />

    <h2 class="mt-1">סיכום לפי פנימייה</h2>
    <div class="cards">
      @for (p of places(); track p.id) {
        <div class="card-cell">
          <app-education-place-stats-card [stats]="p" />
          <a
            mat-button
            color="primary"
            [routerLink]="['/students']"
            [queryParams]="{ educationPlaceId: p.id }"
            >תלמידים בפנימייה</a
          >
        </div>
      }
    </div>
  }
</div>
