<div class="page-container">
  <header class="page-header">
    <div class="back-nav">
      <button mat-icon-button type="button" (click)="goBack()" matTooltip="Back to institutions">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div>
        <h1 class="page-header__title">Students</h1>
        @if (!store.isLoading()) {
          <p class="page-header__subtitle">
            {{ store.activeCount() }} active · {{ store.inactiveCount() }} inactive
          </p>
        }
      </div>
    </div>

    <button
      mat-raised-button
      color="primary"
      type="button"
      [disabled]="store.isLoading() || store.saving()"
      (click)="openCreateDialog()"
    >
      <mat-icon>person_add</mat-icon> Add Student
    </button>
  </header>

  <mat-chip-listbox
    (change)="store.setActiveFilter($event.value)"
    [value]="null"
    hideSingleSelectionIndicator
  >
    @for (opt of filterOptions; track opt.label) {
      <mat-chip-option [value]="opt.value">{{ opt.label }}</mat-chip-option>
    }
  </mat-chip-listbox>

  @if (store.isLoading()) {
    <app-loading-skeleton [rows]="5" />
  } @else if (store.isError()) {
    <app-error-state
      [message]="store.error()?.message ?? 'Failed to load students'"
      (retry)="store.retry()"
    />
  } @else if (store.filteredStudents().length === 0) {
    <app-empty-state
      icon="person_off"
      title="No students found"
      description="No students match the current filter."
    />
  } @else {
    <app-generic-table
      [columns]="columns"
      [data]="store.filteredStudents()"
      [actions]="actions"
      [loading]="store.saving()"
      trackByKey="id"
    />
  }
</div>
