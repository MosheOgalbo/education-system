apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-api
  namespace: education-system
  labels:
    app.kubernetes.io/name: education-system
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: education-system
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-system
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: education-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DISABLE_HTTPS_REDIRECT
              value: "1"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: education-db
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
