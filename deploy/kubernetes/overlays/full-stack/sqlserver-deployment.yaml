# SQL Server 2022 — דורש צמתים amd64 (כמו התמונה הרשמית). על ARM ללא צמתי amd64 הפריסה לא תעלה.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: education-system
  labels:
    app.kubernetes.io/name: education-system
    app.kubernetes.io/component: sqlserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: education-system
      app.kubernetes.io/component: sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-system
        app.kubernetes.io/component: sqlserver
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: education-db
                  key: SA_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sqlserver-data
