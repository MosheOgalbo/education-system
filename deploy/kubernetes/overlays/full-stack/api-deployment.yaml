# כמו deploy/kubernetes/api-deployment.yaml + initContainer שמחכה לסיום מיגרציות לפני עליית ה-API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-api
  namespace: education-system
  labels:
    app.kubernetes.io/name: education-system
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: education-system
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-system
        app.kubernetes.io/component: api
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: wait-for-migrations
          image: mcr.microsoft.com/mssql-tools:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: education-db
                  key: SA_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eu
              SQLCMD=/opt/mssql-tools/bin/sqlcmd
              echo "Waiting for SQL migrations (db-init Job)..."
              i=0
              while [ "$i" -lt 150 ]; do
                if $SQLCMD -S sqlserver -U sa -P "$SA_PASSWORD" -C -h-1 -W -Q "SET NOCOUNT ON; IF DB_ID('EducationSystem') IS NOT NULL AND EXISTS (SELECT 1 FROM EducationSystem.INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='dbo' AND TABLE_NAME='EducationPlace') SELECT 1 AS ok" 2>/dev/null | grep -q "1"; then
                  echo "Database schema is ready."
                  exit 0
                fi
                i=$((i + 1))
                sleep 4
              done
              echo "Timeout waiting for database initialization."
              exit 1
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
      containers:
        - name: api
          image: education-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DISABLE_HTTPS_REDIRECT
              value: "1"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: education-db
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
