# מיפוי /api/ מהווי לשירות ה-API בקלאסטר (בדוק את שם ה-Service ב-api-service.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: education-web-nginx
  namespace: education-system
  labels:
    app.kubernetes.io/name: education-system
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://education-api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
