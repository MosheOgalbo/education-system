apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-web
  namespace: education-system
  labels:
    app.kubernetes.io/name: education-system
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: education-system
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: education-system
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: education-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: education-web-nginx
