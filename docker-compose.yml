services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: education-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Education@123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: education-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "Education@123!"
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/init-db.sh:/scripts/init-db.sh:ro
    entrypoint: ["sh", "/scripts/init-db.sh"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: education-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DISABLE_HTTPS_REDIRECT: "1"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EducationSystem;User Id=sa;Password=Education@123!;TrustServerCertificate=True;"
    # Default host port 5001 — macOS often reserves 5000 (AirPlay Receiver).
    # Override: API_PUBLISH_PORT=8080 docker compose up -d
    ports:
      - "${API_PUBLISH_PORT:-5001}:8080"

  web:
    build:
      context: ./edu-management
      dockerfile: Dockerfile
    container_name: education-web
    depends_on:
      - api
    ports:
      - "${WEB_PUBLISH_PORT:-4200}:80"

volumes:
  sqlserver_data:
